name: Docker Image CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      content: ${{ steps.filter.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - '!src/content/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'astro.config.mjs'
              - 'tsconfig.json'
              - 'tailwind.config.ts'
              - 'Dockerfile'
              - 'scripts/**'
              - 'public/**'
            content:
              - 'src/content/**'
              - 'Dockerfile.content'
              - '.github/workflows/build.yml'

  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate content schema
        run: pnpm content:validate

  docker-app:
    needs: [changes, validate-content]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-content:
    needs: [changes, validate-content]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract content image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-content
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha

      - name: Build and push content image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.content
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

      - name: Pin content image tag for Argo CD
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -eu
          tag="${GITHUB_SHA}"
          kustomization="k8s/overlay/prod/kustomization.yaml"
          patch="k8s/overlay/prod/patch-deployment.yaml"
          python3 - "$tag" "$kustomization" "$patch" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag, kustomization_path, patch_path = sys.argv[1], Path(sys.argv[2]), Path(sys.argv[3])
          lines = kustomization_path.read_text().splitlines(True)
          out = []
          in_images = False
          for line in lines:
              if line.startswith("images:"):
                  in_images = True
              if in_images and line.strip().startswith("newTag:"):
                  line = f"    newTag: {tag}\n"
              out.append(line)
          kustomization_path.write_text("".join(out))
          patch = patch_path.read_text()
          patch = re.sub(r"(ziin\.ai/content-rev:\s*)\S+", rf"\g<1>{tag}", patch)
          patch = re.sub(
              r"(image:\s*ghcr\.io/ziin-ai/signal-agent-content:)\S+",
              rf"\g<1>{tag}",
              patch,
          )
          patch_path.write_text(patch)
          PY
          if git diff --quiet -- "$kustomization" "$patch"; then
            echo "content pin already current"
            exit 0
          fi
          git add "$kustomization" "$patch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "$(cat <<EOF
          Pin content image to ${tag}

          Roll out markdown without rebuilding the app image.
          EOF
          )"
          git push
