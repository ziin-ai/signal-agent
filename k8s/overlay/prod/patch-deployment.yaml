apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-agent
  namespace: ziin-ai
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        ziin.ai/content-rev: d49d84411f777a8b2c79bee6502d8a51a72f3c62
    spec:
      volumes:
        - name: content
          emptyDir: {}
      initContainers:
        - name: content
          image: ghcr.io/ziin-ai/signal-agent-content:d49d84411f777a8b2c79bee6502d8a51a72f3c62
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /content/. /shared/"]
          volumeMounts:
            - name: content
              mountPath: /shared
      containers:
        - name: web
          imagePullPolicy: Always
          env:
            - name: CONTENT_ROOT
              value: /app/content
          volumeMounts:
            - name: content
              mountPath: /app/content
