apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-agent
  namespace: ziin-ai
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        ziin.ai/content-rev: a9599c96ea9928f61f721cf8d0b17fa48d13a2a6
    spec:
      volumes:
        - name: content
          emptyDir: {}
      initContainers:
        - name: content
          image: ghcr.io/ziin-ai/signal-agent-content:a9599c96ea9928f61f721cf8d0b17fa48d13a2a6
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /content/. /shared/"]
          volumeMounts:
            - name: content
              mountPath: /shared
      containers:
        - name: web
          imagePullPolicy: Always
          env:
            - name: CONTENT_ROOT
              value: /app/content
          volumeMounts:
            - name: content
              mountPath: /app/content
