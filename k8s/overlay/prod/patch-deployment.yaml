apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-agent
  namespace: ziin-ai
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        ziin.ai/content-rev: c94a4b1ca02bc8c7329c5ff501d0de022b07a6a2
    spec:
      volumes:
        - name: content
          emptyDir: {}
      initContainers:
        - name: content
          image: ghcr.io/ziin-ai/signal-agent-content:c94a4b1ca02bc8c7329c5ff501d0de022b07a6a2
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /content/. /shared/"]
          volumeMounts:
            - name: content
              mountPath: /shared
      containers:
        - name: web
          imagePullPolicy: Always
          env:
            - name: CONTENT_ROOT
              value: /app/content
          volumeMounts:
            - name: content
              mountPath: /app/content
