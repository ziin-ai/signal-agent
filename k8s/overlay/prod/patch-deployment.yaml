apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-agent
  namespace: ziin-ai
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        ziin.ai/content-rev: d6cc71f3bcab2c3a36c6e4e0fa41d9bdbc512f37
    spec:
      volumes:
        - name: content
          emptyDir: {}
      initContainers:
        - name: content
          image: ghcr.io/ziin-ai/signal-agent-content:d6cc71f3bcab2c3a36c6e4e0fa41d9bdbc512f37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /content/. /shared/"]
          volumeMounts:
            - name: content
              mountPath: /shared
      containers:
        - name: web
          imagePullPolicy: Always
          env:
            - name: CONTENT_ROOT
              value: /app/content
          volumeMounts:
            - name: content
              mountPath: /app/content
