apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-agent
  namespace: ziin-ai
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        ziin.ai/content-rev: d6b9fa7ec1c0a1a6ad22f2d4b0a78b7ae30073a1
    spec:
      volumes:
        - name: content
          emptyDir: {}
      initContainers:
        - name: content
          image: ghcr.io/ziin-ai/signal-agent-content:d6b9fa7ec1c0a1a6ad22f2d4b0a78b7ae30073a1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /content/. /shared/"]
          volumeMounts:
            - name: content
              mountPath: /shared
      containers:
        - name: web
          imagePullPolicy: Always
          env:
            - name: CONTENT_ROOT
              value: /app/content
          volumeMounts:
            - name: content
              mountPath: /app/content
